<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none">
  <rect width="960" height="600" fill="#121418"/>
  <defs>
    <pattern id="g3" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.4" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <linearGradient id="glow3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6b7fff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6b7fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#g3)"/>
  <rect width="960" height="600" fill="url(#glow3)"/>
  <!-- Grid lines -->
  <line x1="100" y1="0" x2="100" y2="600" stroke="#1e2230" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="600" stroke="#1e2230" stroke-width="1"/>
  <line x1="580" y1="0" x2="580" y2="600" stroke="#1e2230" stroke-width="1"/>
  <line x1="820" y1="0" x2="820" y2="600" stroke="#1e2230" stroke-width="1"/>
  <line x1="0" y1="150" x2="960" y2="150" stroke="#1e2230" stroke-width="1"/>
  <line x1="0" y1="350" x2="960" y2="350" stroke="#1e2230" stroke-width="1"/>
  <line x1="0" y1="550" x2="960" y2="550" stroke="#1e2230" stroke-width="1"/>
  <!-- Highlighted cell -->
  <rect x="340" y="150" width="240" height="200" fill="#6b7fff" fill-opacity="0.04" stroke="#6b7fff" stroke-opacity="0.25" stroke-width="1.5" rx="2"/>
  <circle cx="460" cy="250" r="8" fill="#6b7fff" fill-opacity="0.5"/>
  <!-- Small accent bar -->
  <rect x="104" y="40" width="80" height="3" rx="1.5" fill="#6b7fff" fill-opacity="0.45"/>
  <rect x="104" y="52" width="50" height="3" rx="1.5" fill="#2e3348"/>
  <rect x="104" y="64" width="65" height="3" rx="1.5" fill="#2e3348" fill-opacity="0.5"/>
  <!-- Bottom lines -->
  <line x1="104" y1="500" x2="540" y2="500" stroke="#2e3348" stroke-width="1"/>
  <line x1="104" y1="520" x2="460" y2="520" stroke="#2e3348" stroke-opacity="0.6" stroke-width="1"/>
  <line x1="104" y1="540" x2="380" y2="540" stroke="#2e3348" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Diagonal -->
  <line x1="700" y1="100" x2="860" y2="260" stroke="#6b7fff" stroke-opacity="0.08" stroke-width="1.5"/>
  <line x1="740" y1="100" x2="900" y2="260" stroke="#6b7fff" stroke-opacity="0.06" stroke-width="1"/>
</svg>
