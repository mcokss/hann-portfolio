<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none">
  <rect width="960" height="600" fill="#121418"/>
  <!-- Grid -->
  <defs>
    <pattern id="g1" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="0.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7fff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6b7fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#g1)"/>
  <!-- Glow -->
  <circle cx="720" cy="200" r="300" fill="url(#glow1)"/>
  <!-- Geometric shapes -->
  <circle cx="700" cy="180" r="140" stroke="#6b7fff" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="700" cy="180" r="90" stroke="#2e3348" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="700" cy="180" r="4" fill="#6b7fff"/>
  <!-- Lines -->
  <line x1="80" y1="420" x2="400" y2="420" stroke="#2e3348" stroke-width="1"/>
  <line x1="80" y1="450" x2="340" y2="450" stroke="#2e3348" stroke-opacity="0.6" stroke-width="1"/>
  <line x1="80" y1="480" x2="280" y2="480" stroke="#2e3348" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Corner accent -->
  <rect x="80" y="80" width="100" height="3" rx="1.5" fill="#6b7fff" fill-opacity="0.5"/>
  <rect x="80" y="95" width="70" height="3" rx="1.5" fill="#6b7fff" fill-opacity="0.3"/>
  <rect x="80" y="110" width="50" height="3" rx="1.5" fill="#6b7fff" fill-opacity="0.15"/>
  <!-- Grid corner -->
  <rect x="80" y="160" width="48" height="48" stroke="#2e3348" stroke-opacity="0.4" rx="6" fill="none"/>
  <rect x="140" y="160" width="48" height="48" stroke="#2e3348" stroke-opacity="0.4" rx="6" fill="none"/>
  <rect x="80" y="220" width="48" height="48" stroke="#2e3348" stroke-opacity="0.4" rx="6" fill="none"/>
  <rect x="140" y="220" width="48" height="48" stroke="#2e3348" stroke-opacity="0.4" rx="6" fill="#6b7fff" fill-opacity="0.08"/>
</svg>
